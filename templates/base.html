{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Anti-flicker: aplica o tema salvo antes de pintar o DOM -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-bs-theme', saved);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-bs-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>

    <title>{% block title %}Grão & Prosa | Cafés Especiais{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{% static 'img/logo-icon-light.svg' %}">

    <!-- Bootstrap 5.3.3 CSS (conforme aulaBootstrap.md) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Font Awesome 6.5.0 (conforme aulaBootstrap.md) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS do Projeto -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body class="bg-body d-flex flex-column min-vh-100">

    <!-- Cabeçalho e Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-gp sticky-top py-2">
            <div class="container-fluid px-3 px-md-4 px-xl-5">
                <!-- Logotipo -->
                <a class="navbar-brand d-flex align-items-center me-4 me-xl-5" href="/" aria-label="Grão & Prosa - Página Inicial">
                    <img src="{% static 'img/logo-full-light.svg' %}" alt="Grão & Prosa" class="logo-light">
                    <img src="{% static 'img/logo-full-dark.svg' %}" alt="Grão & Prosa" class="logo-dark">
                </a>

                <!-- Botão Hambúrguer para telas menores -->
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Alternar menu de navegação">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>

                <!-- Conteúdo Colapsável -->
                <div class="collapse navbar-collapse" id="navbarContent">
                    <!-- Links Principais -->
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1 gap-lg-2">
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center" href="/">
                                <i class="fa-solid fa-mug-hot icon-coffee me-2"></i>Catálogo & Feed
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center" href="#dashboard">
                                <i class="fa-solid fa-chart-pie icon-stats me-2"></i>Dashboard
                            </a>
                        </li>
                    </ul>

                    <!-- Barra de Busca Rápida com Contorno Leve e Destaque -->
                    <form class="d-flex my-2 my-lg-0 me-lg-3 me-xl-4" method="get" action="/" role="search">
                        <div class="input-group search-group-gp">
                            <input class="form-control search-input-gp" type="search" name="q" placeholder="Buscar cafés, marcas..." aria-label="Buscar">
                            <button class="btn search-btn-gp" type="submit" aria-label="Buscar">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </button>
                        </div>
                    </form>

                    <!-- Ações da Direita: Tema e Botões de Acesso -->
                    <div class="d-flex align-items-center gap-2 gap-lg-3 py-2 py-lg-0">
                        <!-- Botão de Alternância de Tema -->
                        <button id="themeToggle" class="btn btn-theme-toggle" type="button"
                            aria-label="Alternar tema claro e escuro" title="Alternar tema claro e escuro">
                            Tema <i class="fa-solid fa-moon icon-coffee ms-1" aria-hidden="true"></i>
                        </button>

                        <button class="btn btn-coffee-outline" type="button">
                            <i class="fa-solid fa-right-to-bracket me-1"></i>Entrar
                        </button>
                        <button class="btn btn-coffee-fill" type="button">
                            <i class="fa-solid fa-user-plus me-1"></i>Cadastre-se
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow-1 py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="py-4 footer-gp mt-auto">
        <div class="container text-center text-body-secondary small">
            <div>&copy; 2026 Grão & Prosa &bull; Disciplina GAC116 - Programação Web (UFLA)</div>
        </div>
    </footer>

    <!-- Bootstrap 5.3.3 Bundle JS com Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- JavaScript Customizado do Tema Claro/Escuro -->
    <script src="{% static 'js/theme.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
