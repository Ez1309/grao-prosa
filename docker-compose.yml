services:
  web:
    build: .
    container_name: grao_prosa_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:16-alpine
    container_name: grao_prosa_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-grao_prosa_db}
      POSTGRES_USER: ${DB_USER:-grao_prosa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grao_prosa_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-grao_prosa_user} -d $${DB_NAME:-grao_prosa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
