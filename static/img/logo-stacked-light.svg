<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" width="100%" height="100%">
  <defs>
    <!-- Filtros de Sombra Suave -->
    <filter id="stkDepth" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#120804" flood-opacity="0.22"/>
    </filter>

    <!-- Cerâmica da Xícara Modo Claro -->
    <linearGradient id="stkCupCeramic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56301E"/>
      <stop offset="35%" stop-color="#422416"/>
      <stop offset="70%" stop-color="#321A10"/>
      <stop offset="100%" stop-color="#241109"/>
    </linearGradient>
    <linearGradient id="stkCupRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C68642"/>
      <stop offset="50%" stop-color="#F2C58A"/>
      <stop offset="100%" stop-color="#8F5424"/>
    </linearGradient>
    <linearGradient id="stkSaucerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58311D"/>
      <stop offset="50%" stop-color="#3E2012"/>
      <stop offset="100%" stop-color="#221008"/>
    </linearGradient>
    <linearGradient id="stkSaucerRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C623E"/>
      <stop offset="50%" stop-color="#DE9F67"/>
      <stop offset="100%" stop-color="#6E3B1E"/>
    </linearGradient>

    <!-- Líquido Clássico Café -->
    <radialGradient id="stkCoffeeLiquid" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#2A140A"/>
      <stop offset="55%" stop-color="#180A04"/>
      <stop offset="100%" stop-color="#060101"/>
    </radialGradient>

    <!-- Grão de Café -->
    <linearGradient id="stkGrainLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C6343"/>
      <stop offset="50%" stop-color="#844D2F"/>
      <stop offset="100%" stop-color="#63351C"/>
    </linearGradient>
    <linearGradient id="stkGrainDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#452214"/>
      <stop offset="60%" stop-color="#2E140B"/>
      <stop offset="100%" stop-color="#1A0A05"/>
    </linearGradient>

    <!-- Cerejas e Folhas -->
    <radialGradient id="stkBerry" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E23E3E"/>
      <stop offset="45%" stop-color="#A81B1B"/>
      <stop offset="85%" stop-color="#5E0B0B"/>
      <stop offset="100%" stop-color="#360303"/>
    </radialGradient>
    <linearGradient id="stkLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E7C45"/>
      <stop offset="60%" stop-color="#2D5326"/>
      <stop offset="100%" stop-color="#183313"/>
    </linearGradient>

    <!-- Fumaça Aromática Suave -->
    <linearGradient id="stkSteam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C68642" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C68642" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#C68642" stop-opacity="0"/>
    </linearGradient>

    <!-- Dourado do Texto -->
    <linearGradient id="stkGoldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A5632A"/>
      <stop offset="50%" stop-color="#C68642"/>
      <stop offset="100%" stop-color="#8C4A17"/>
    </linearGradient>
  </defs>

  <!-- ==================== ÍCONE DA XÍCARA CENTRALIZADO ==================== -->
  <g filter="url(#stkDepth)" transform="translate(93, 10) scale(0.55)">
    <!-- Fumaça Aromática Suave -->
    <path d="M106,66 C102,46 112,32 106,12 C103,4 98,1 94,-5" fill="none" stroke="url(#stkSteam)" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M125,66 C129,48 119,34 125,16 C128,8 132,3 138,-3" fill="none" stroke="url(#stkSteam)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Pírex / Prato -->
    <g transform="translate(0, 7)">
      <ellipse cx="120" cy="154" rx="92" ry="25" fill="#0E0502" opacity="0.45"/>
      <ellipse cx="120" cy="148" rx="88" ry="23" fill="url(#stkSaucerBody)"/>
      <ellipse cx="120" cy="147" rx="87.5" ry="22.5" fill="none" stroke="url(#stkSaucerRim)" stroke-width="1.8"/>
      <ellipse cx="120" cy="147.5" rx="77" ry="17.5" fill="#1C0D07" opacity="0.8"/>
    </g>

    <!-- Xícara de Café -->
    <g>
      <path d="M165,95 C192,95 204,115 197,134 C189,147 172,148 156,140 C162,136 166,133 167,130 C182,130 187,118 184,111 C181,104 173,103 165,103 Z" fill="url(#stkCupCeramic)" stroke-linejoin="round"/>
      <path d="M166,96 C189,96 199,113 192,131 C187,142 173,144 158,139" fill="none" stroke="#F2C58A" stroke-width="1.4" opacity="0.7" stroke-linecap="round"/>
      <path d="M66,86 C68,135 90,153 120,153 C150,153 172,135 174,86 Z" fill="url(#stkCupCeramic)"/>
      <ellipse cx="120" cy="86" rx="54" ry="12.8" fill="url(#stkCupRim)"/>
      <ellipse cx="120" cy="86" rx="51" ry="10.8" fill="#170A04"/>
      <ellipse cx="120" cy="86.5" rx="48.5" ry="9.2" fill="url(#stkCoffeeLiquid)"/>
      <!-- Bolhas e reflexo -->
      <circle cx="93" cy="87" r="1.7" fill="#D49449" opacity="0.8"/>
      <circle cx="93" cy="87" r="0.7" fill="#1A0B05"/>
      <circle cx="96.5" cy="86.2" r="1.2" fill="#D49449" opacity="0.75"/>
      <circle cx="147" cy="87.8" r="1.3" fill="#D49449" opacity="0.65"/>
      <path d="M106,85.2 C116,83.8 128,83.8 136,85.2" fill="none" stroke="#FFF" stroke-width="1.5" opacity="0.45" stroke-linecap="round"/>
    </g>

    <!-- Ramo de Fruto e Folhas à Esquerda -->
    <g transform="translate(34, 146) scale(1.12)">
      <path d="M13,11 C2,-4 -9,-11 -21,-17" fill="none" stroke="#4F2E1E" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M10,6 C-8,4 -22,-10 -28,-26 C-14,-28 4,-18 10,6 Z" fill="url(#stkLeaf)"/>
      <circle cx="12" cy="14" r="10.5" fill="url(#stkBerry)"/>
      <ellipse cx="8.5" cy="10.5" rx="3" ry="1.7" transform="rotate(-30 8.5 10.5)" fill="#FFF" opacity="0.7"/>
      <circle cx="27" cy="19" r="8" fill="url(#stkBerry)"/>
    </g>

    <!-- Grão de Café no Pires à Direita -->
    <g transform="translate(197, 155) rotate(-38) scale(0.68)" filter="url(#stkDepth)">
      <ellipse cx="0" cy="4.5" rx="22" ry="11" fill="#0A0301" opacity="0.6"/>
      <path d="M0,-29 C-16,-21 -24,-7 -24,6 C-24,19 -15,29 0,29 C15,29 24,19 24,6 C24,-7 16,-21 0,-29 Z" fill="#2E140B"/>
      <path d="M0,-28 C-14,-20 -22,-6 -22,6 C-22,18 -13,27 0,27 C-7,18 -9,5 -4,-7 C-1,-14 -1,-20 0,-28 Z" fill="url(#stkGrainLight)"/>
      <path d="M-9,-19 C-16,-9 -18,3 -12,17 C-17,5 -15,-7 -8,-17 Z" fill="#C48862" opacity="0.85"/>
      <path d="M0,-28 C14,-20 22,-6 22,6 C22,18 13,27 0,27 C7,18 9,5 4,-7 C1,-14 1,-20 0,-28 Z" fill="url(#stkGrainDark)"/>
      <path d="M0,-27 C-5,-14 6,-2 0,12 C-4,19 2,25 0,26" fill="none" stroke="#7A4528" stroke-width="4" stroke-linecap="round"/>
      <path d="M0,-27 C-5,-14 6,-2 0,12 C-4,19 2,25 0,26" fill="none" stroke="#0A0201" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ==================== TIPOGRAFIA VERTICAL CENTRALIZADA ==================== -->
  <g text-anchor="middle">
    <!-- Linha decorativa suave -->
    <line x1="120" y1="172" x2="200" y2="172" stroke="url(#stkGoldText)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

    <!-- Título Principal -->
    <text x="160" y="212" font-family="'Playfair Display', 'Georgia', 'Cinzel', serif" font-size="36" font-weight="700" letter-spacing="-0.3" fill="#24110A">
      Grão
      <tspan font-family="'Cinzel', 'Playfair Display', serif" font-weight="400" font-size="32" fill="url(#stkGoldText)"> &amp; </tspan>
      Prosa
    </text>

    <!-- Subtítulo -->
    <text x="160" y="235" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="3.2" fill="#8F5424">
      CAFÉS ESPECIAIS &amp; COMUNIDADE
    </text>

    <!-- Sublinhado de fechamento -->
    <line x1="145" y1="246" x2="175" y2="246" stroke="url(#stkGoldText)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
