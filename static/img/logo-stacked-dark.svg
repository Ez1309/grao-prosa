<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" width="100%" height="100%">
  <defs>
    <!-- Filtros de Sombra Suave Fundo Escuro -->
    <filter id="stkdDepth" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Cerâmica da Xícara Modo Escuro (Porcelana Marfim Nobre) -->
    <linearGradient id="stkdCupCeramic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="40%" stop-color="#F2E6D8"/>
      <stop offset="100%" stop-color="#D9C4AF"/>
    </linearGradient>
    <linearGradient id="stkdCupRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C68642"/>
      <stop offset="50%" stop-color="#F2C58A"/>
      <stop offset="100%" stop-color="#8F5424"/>
    </linearGradient>
    <linearGradient id="stkdSaucerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#EADBCC"/>
      <stop offset="100%" stop-color="#CDB69E"/>
    </linearGradient>
    <linearGradient id="stkdSaucerRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE9F67"/>
      <stop offset="50%" stop-color="#FCEADE"/>
      <stop offset="100%" stop-color="#B87640"/>
    </linearGradient>

    <!-- Líquido Clássico Café -->
    <radialGradient id="stkdCoffeeLiquid" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#30160B"/>
      <stop offset="55%" stop-color="#1B0B04"/>
      <stop offset="100%" stop-color="#060101"/>
    </radialGradient>

    <!-- Grão de Café -->
    <linearGradient id="stkdGrainLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA6C4B"/>
      <stop offset="50%" stop-color="#8E5334"/>
      <stop offset="100%" stop-color="#6B3A20"/>
    </linearGradient>
    <linearGradient id="stkdGrainDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B2516"/>
      <stop offset="60%" stop-color="#33170D"/>
      <stop offset="100%" stop-color="#1C0A05"/>
    </linearGradient>

    <!-- Cerejas e Folhas -->
    <radialGradient id="stkdBerry" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F54A4A"/>
      <stop offset="45%" stop-color="#B82020"/>
      <stop offset="85%" stop-color="#6E0E0E"/>
      <stop offset="100%" stop-color="#3D0505"/>
    </radialGradient>
    <linearGradient id="stkdLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E9653"/>
      <stop offset="60%" stop-color="#386B30"/>
      <stop offset="100%" stop-color="#1E4218"/>
    </linearGradient>

    <!-- Fumaça Aromática Suave -->
    <linearGradient id="stkdSteam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E6CCB2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E6CCB2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#E6CCB2" stop-opacity="0"/>
    </linearGradient>

    <!-- Dourado do Texto -->
    <linearGradient id="stkdGoldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE9F67"/>
      <stop offset="50%" stop-color="#FCEADE"/>
      <stop offset="100%" stop-color="#B87640"/>
    </linearGradient>
  </defs>

  <!-- ==================== ÍCONE DA XÍCARA CENTRALIZADO ==================== -->
  <g filter="url(#stkdDepth)" transform="translate(93, 10) scale(0.55)">
    <!-- Fumaça Aromática Suave -->
    <path d="M106,66 C102,46 112,32 106,12 C103,4 98,1 94,-5" fill="none" stroke="url(#stkdSteam)" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M125,66 C129,48 119,34 125,16 C128,8 132,3 138,-3" fill="none" stroke="url(#stkdSteam)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Pírex / Prato -->
    <g transform="translate(0, 7)">
      <ellipse cx="120" cy="154" rx="92" ry="25" fill="#050201" opacity="0.6"/>
      <ellipse cx="120" cy="148" rx="88" ry="23" fill="url(#stkdSaucerBody)"/>
      <ellipse cx="120" cy="147" rx="87.5" ry="22.5" fill="none" stroke="url(#stkdSaucerRim)" stroke-width="1.8"/>
      <ellipse cx="120" cy="147.5" rx="77" ry="17.5" fill="#1C0D07" opacity="0.85"/>
    </g>

    <!-- Xícara de Porcelana Marfim Nobre -->
    <g>
      <path d="M165,95 C192,95 204,115 197,134 C189,147 172,148 156,140 C162,136 166,133 167,130 C182,130 187,118 184,111 C181,104 173,103 165,103 Z" fill="url(#stkdCupCeramic)" stroke-linejoin="round"/>
      <path d="M166,96 C189,96 199,113 192,131 C187,142 173,144 158,139" fill="none" stroke="#FCEADE" stroke-width="1.4" opacity="0.8" stroke-linecap="round"/>
      <path d="M66,86 C68,135 90,153 120,153 C150,153 172,135 174,86 Z" fill="url(#stkdCupCeramic)"/>
      <ellipse cx="120" cy="86" rx="54" ry="12.8" fill="url(#stkdCupRim)"/>
      <ellipse cx="120" cy="86" rx="51" ry="10.8" fill="#170A04"/>
      <ellipse cx="120" cy="86.5" rx="48.5" ry="9.2" fill="url(#stkdCoffeeLiquid)"/>
      <!-- Bolhas e reflexo -->
      <circle cx="93" cy="87" r="1.7" fill="#E8B06C" opacity="0.85"/>
      <circle cx="93" cy="87" r="0.7" fill="#1A0B05"/>
      <circle cx="96.5" cy="86.2" r="1.2" fill="#E8B06C" opacity="0.8"/>
      <circle cx="147" cy="87.8" r="1.3" fill="#E8B06C" opacity="0.7"/>
      <path d="M106,85.2 C116,83.8 128,83.8 136,85.2" fill="none" stroke="#FFF" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
    </g>

    <!-- Ramo de Fruto e Folhas à Esquerda -->
    <g transform="translate(34, 146) scale(1.12)">
      <path d="M13,11 C2,-4 -9,-11 -21,-17" fill="none" stroke="#3D2114" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M10,6 C-8,4 -22,-10 -28,-26 C-14,-28 4,-18 10,6 Z" fill="url(#stkdLeaf)"/>
      <circle cx="12" cy="14" r="10.5" fill="url(#stkdBerry)"/>
      <ellipse cx="8.5" cy="10.5" rx="3" ry="1.7" transform="rotate(-30 8.5 10.5)" fill="#FFF" opacity="0.7"/>
      <circle cx="27" cy="19" r="8" fill="url(#stkdBerry)"/>
    </g>

    <!-- Grão de Café no Pires à Direita -->
    <g transform="translate(197, 155) rotate(-38) scale(0.68)" filter="url(#stkdDepth)">
      <ellipse cx="0" cy="4.5" rx="22" ry="11" fill="#050201" opacity="0.7"/>
      <path d="M0,-29 C-16,-21 -24,-7 -24,6 C-24,19 -15,29 0,29 C15,29 24,19 24,6 C24,-7 16,-21 0,-29 Z" fill="#2E140B"/>
      <path d="M0,-28 C-14,-20 -22,-6 -22,6 C-22,18 -13,27 0,27 C-7,18 -9,5 -4,-7 C-1,-14 -1,-20 0,-28 Z" fill="url(#stkdGrainLight)"/>
      <path d="M-9,-19 C-16,-9 -18,3 -12,17 C-17,5 -15,-7 -8,-17 Z" fill="#DDB892" opacity="0.85"/>
      <path d="M0,-28 C14,-20 22,-6 22,6 C22,18 13,27 0,27 C7,18 9,5 4,-7 C1,-14 1,-20 0,-28 Z" fill="url(#stkdGrainDark)"/>
      <path d="M0,-27 C-5,-14 6,-2 0,12 C-4,19 2,25 0,26" fill="none" stroke="#9C5D35" stroke-width="4" stroke-linecap="round"/>
      <path d="M0,-27 C-5,-14 6,-2 0,12 C-4,19 2,25 0,26" fill="none" stroke="#120502" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ==================== TIPOGRAFIA VERTICAL CENTRALIZADA ==================== -->
  <g text-anchor="middle">
    <!-- Linha decorativa suave -->
    <line x1="120" y1="172" x2="200" y2="172" stroke="url(#stkdGoldText)" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>

    <!-- Título Principal -->
    <text x="160" y="212" font-family="'Playfair Display', 'Georgia', 'Cinzel', serif" font-size="36" font-weight="700" letter-spacing="-0.3" fill="#FFFDF9">
      Grão
      <tspan font-family="'Cinzel', 'Playfair Display', serif" font-weight="400" font-size="32" fill="url(#stkdGoldText)"> &amp; </tspan>
      Prosa
    </text>

    <!-- Subtítulo -->
    <text x="160" y="235" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="3.2" fill="#DDB892">
      CAFÉS ESPECIAIS &amp; COMUNIDADE
    </text>

    <!-- Sublinhado de fechamento -->
    <line x1="145" y1="246" x2="175" y2="246" stroke="url(#stkdGoldText)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
